<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="claude:viewport-fit-sides" content="cover"><title>강원 여행 수첩</title><link rel="stylesheet" href="css/base.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Serif+KR:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/p0.css"><script defer src="js/config.js"></script></head><body>

<header class="hero">
  <div class="hero-art" role="img" aria-label="비행기와 기차, 산과 바다, 해안도로를 달리는 자동차를 색연필로 그린 강원 여행 그림">
    <svg class="hero-plane" viewBox="0 0 64 26" aria-hidden="true"><path d="M2 14 C6 9 44 8 56 11 C62 12 62 15 56 16 C44 19 6 19 2 14Z" fill="#fff" stroke="#9fb6cc"/><path d="M26 12 L16 1 L22 1 L36 12Z M26 16 L16 25 L22 25 L36 16Z" fill="#e9eef4" stroke="#9fb6cc" stroke-width=".8"/><path d="M5 13 L1 5 L5 5 L11 12Z" fill="#ff6b5a"/><g fill="#2e6fae"><circle cx="44" cy="13" r="1.4"/><circle cx="38" cy="13" r="1.4"/><circle cx="32" cy="13" r="1.4"/></g></svg>
  </div>
  <div class="inner">
    <div class="langbar seg" id="langSeg" data-pos="A1" role="group" aria-label="Language" data-noi18n><button data-lang="ko">한국어</button><button data-lang="en">EN</button><button data-lang="zh">中文</button><button data-lang="ja">日本語</button></div>
    <div data-pos="A2">
      <div class="kicker">Gangwon-do, mountains &amp; the East Sea</div>
      <h1>강원 여행 수첩</h1>
      <p class="lede">강릉·속초·양양부터 평창·정선·춘천까지. 가볼 곳과 가성비 숙소, 휴무일, 할인 방법, 동선과 준비물을 지역과 날짜, 동행에 맞춰 보여 드려요.</p>
    </div>
    <div class="hero-row">
      <div class="cond">
        <div class="field datefield" data-pos="A3"><div class="lblrow"><span class="lbl" id="dateLbl">WHEN · 가는 날 ~ 오는 날</span><button type="button" class="daytrip" id="dayTripBtn" aria-pressed="false">☀️ 당일치기</button></div>
          <div class="daterange"><input type="date" id="tripDate" aria-label="가는 날"><span class="dsep" aria-hidden="true">~</span><input type="date" id="tripDateEnd" aria-label="오는 날"></div></div>
        <div class="field" data-pos="A4"><span class="lbl">WITH · 누구와</span>
          <span class="seg" id="whoSeg" role="group" aria-label="동행 선택">
            <button data-who="친구">친구</button><button data-who="연인">연인</button><button data-who="가족">가족</button><button data-who="혼자">혼자</button>
          </span>
        </div>
      </div>
      <div class="today" id="todayBox" data-pos="A5"></div>
    </div>
    <div id="heroPhotos" data-pos="A6" style="display:grid;gap:6px"></div>
    <div class="field" data-pos="A7"><span class="lbl">WHERE · 지역</span><div class="days regions" id="regionChips" role="group" aria-label="지역 선택"></div></div>
    <div class="days" id="dayChips" data-pos="A8" role="group" aria-label="일차 선택"></div>
  </div>
</header>

<div class="pagebar" id="pageBar"><button class="pbhome" data-tab="places" aria-label="가볼 곳으로">‹ 홈</button><b id="pageTitle"></b></div>
<div class="tabbar" data-pos="B">
  <div class="inner">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="places" data-pos="B1">가볼 곳</button>
      <button role="tab" data-tab="transit" data-pos="B2">교통</button>
      <button role="tab" data-tab="season" data-pos="B3">계절&amp;행사</button>
      <button role="tab" data-tab="deals" data-pos="B4">할인 방법</button>
      <button role="tab" data-tab="pack" data-pos="B5">준비물</button>
      <button role="tab" data-tab="souv" data-pos="B6">특산품·선물</button>
      <button role="tab" data-tab="ops" id="opsTab" hidden>운영</button>
    </nav>
    <button class="searchbtn" id="searchBtn" data-pos="B7" type="button" aria-label="장소 검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="stxt">검색</span></button>
  </div>
</div>

<main class="inner">
  <section class="panel" id="tab-places"></section>
  <section class="panel" id="tab-transit" data-pos="D" hidden></section>
  <section class="panel" id="tab-season" data-pos="H" hidden></section>
  <section class="panel" id="tab-course" hidden></section>
  <section class="panel" id="tab-deals" data-pos="I" hidden></section>
  <section class="panel" id="tab-pack" data-pos="J" hidden></section>
  <section class="panel" id="tab-souv" data-pos="K" hidden></section>
  <section class="panel" id="tab-journal" hidden></section>
  <section class="panel ops" id="tab-ops" hidden></section>
  <section class="panel" id="tab-favs" hidden></section>
  <section class="panel" id="tab-coupons" hidden></section>
  <section class="panel" id="tab-my" hidden></section>
  <section class="panel" id="tab-more" hidden></section>
  <div class="apkentry" id="apkEntry" hidden></div>
</main>
<nav class="bnav" aria-label="하단 메뉴" data-pos="E">
  <button data-tab="course" data-pos="E1"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>일정</span><em class="bcount" id="courseCount">0</em></button>
  <button data-tab="favs" data-pos="E2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>찜</span><em class="bcount" id="favCount">0</em></button>
  <button data-tab="coupons" data-pos="E3"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8a2 2 0 0 0 0 4v0a2 2 0 0 1 0 4v1h18v-1a2 2 0 0 1 0-4 2 2 0 0 0 0-4V7H3z"/><path d="M14 7v10" stroke-dasharray="2 2"/></svg><span>쿠폰북</span></button>
  <button data-tab="my" data-pos="E4"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4.2-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg><span>마이페이지</span><em class="bcount" id="stampCount" hidden>0</em></button>
  <button data-tab="more" data-pos="E5"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg><span>더보기</span></button>
</nav>
<div class="sidedock" id="sideDock" data-pos="F1" aria-label="빠른 메뉴">
  <button class="sdhandle" id="sdHandle" type="button" aria-expanded="false" aria-label="내 주변·야간 병원·화장실·주차장 메뉴 열기"><span class="sdgrip"></span><i>📍</i>주변<i>🌙</i>병원<span class="sdgrip"></span></button>
  <div class="sdpanel">
    <b>📍 내 주변</b>
    <div class="sdrow"><button class="chipbtn" data-near="1">1km</button><button class="chipbtn" data-near="4">4km</button><button class="chipbtn" data-near="10">10km</button></div>
    <button class="chipbtn medchip" data-openmed="1">🌙 야간 병원·약국</button>
    <button class="chipbtn" data-openfac="wc">🚻 공중화장실</button>
    <button class="chipbtn" data-openfac="pk">🅿️ 공영주차장</button>
    <button class="chipbtn" data-detail="wx:1">🌤️ 주간 날씨</button>
  </div>
</div>
<div class="subpage" id="subPage" hidden role="dialog" aria-modal="true" aria-labelledby="subTitle">
  <div class="subbar"><button class="sback" id="subBack" type="button" aria-label="뒤로">‹</button><b id="subTitle"></b></div>
  <div class="subbody inner" id="subBody"></div>
</div>
<div class="zoombox" id="zoomBox" hidden role="dialog" aria-label="사진 크게 보기"><button class="zx" aria-label="닫기">×</button><img alt=""></div>
<div class="searchov" id="searchOv" hidden role="dialog" aria-label="장소 검색">
  <div class="sbar"><input id="searchQ" type="search" placeholder="장소·음식·동네 검색 (예: 칼국수, 주문진)" autocomplete="off" enterkeyhint="search" aria-label="검색어"><button class="sclose" id="searchClose" type="button">닫기</button></div>
  <div class="sres" id="searchRes"></div>
</div>
