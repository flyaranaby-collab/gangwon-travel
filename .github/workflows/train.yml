name: 열차 시간표 업데이트
# 국토교통부(TAGO) 열차정보로 강원 주요 역 시간표·요금 7일치를 받아 web/train.json 에 저장한다.
# 저장소 비밀값 KTO_KEY(공공데이터포털 일반 인증키)를 쓴다. 포털에서 '국토교통부_(TAGO)_열차정보' 활용신청이 필요하다.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 18 * * *'   # 매일 새벽 3시 41분(한국 시간)
permissions:
  contents: write
concurrency:
  group: train
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 열차 시간표 받기
        env: { KTO_KEY: "${{ secrets.KTO_KEY }}" }
        run: python3 tools/train_sync.py --key "$KTO_KEY" --out web/train.json
      - name: 저장소에 올리기
        run: |
          git config user.name "gangwon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/train.json
          git diff --cached --quiet && echo "바뀐 내용 없음" && exit 0
          git commit -m "열차 시간표 업데이트 (자동)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push && exit 0
            echo "올리기 재시도 $i"; sleep $((i*10))
          done
          exit 1
