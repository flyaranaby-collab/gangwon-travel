<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<script>window.APK_BUILD=true;document.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="IMG"&&!t.dataset.fb&&t.src.indexOf("file:///android_asset/photos/")===0){t.dataset.fb="1";t.src="https://raw.githubusercontent.com/flyaranaby-collab/gangwon-travel/main/web/photos/"+t.src.split("/").pop();}},true);</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 새벽 동해를 그린 히어로(조건 설정) → 고정 탭 → 넉넉한 여백의 카드 목록. 포인트는 황동빛 하나만. */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --ink: #131925;
  --muted: #687185;
  --line: #e2e5eb;
  --brass: #8a6a38;
  --brass-soft: #f3ece0;
  --sea: #24466b;
  --sea-soft: #e3eaf3;
  --pine: #2f6a52;
  --pine-soft: #e1efe7;
  --warn: #a2601c;
  --warn-soft: #f8ecdc;
  --bad: #b03b3b;
  --bad-soft: #f8e3e3;
  --shadow: 0 1px 2px rgba(19,25,37,.04), 0 8px 24px rgba(19,25,37,.06);
  /* 히어로는 두 테마 모두 새벽 바다 */
  --hero-top: #0a1324;
  --hero-mid: #1d3150;
  --hero-glow: #e7b679;
  --hero-ink: #f4efe6;
  --hero-muted: #b9c0cf;
  --font-display: "Noto Serif KR", "Nanum Myeongjo", serif;
  --font-accent: "Cormorant Garamond", "Times New Roman", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1019; --surface: #131a26; --ink: #ece7dd; --muted: #98a1b2; --line: #232c3b;
  --brass: #d4b37a; --brass-soft: #2a2316; --sea: #9dbbe0; --sea-soft: #172338;
  --pine: #8ccaa8; --pine-soft: #16301f; --warn: #e6a764; --warn-soft: #36270f; --bad: #ef8f8f; --bad-soft: #3a1c1c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1019; --surface: #131a26; --ink: #ece7dd; --muted: #98a1b2; --line: #232c3b;
  --brass: #d4b37a; --brass-soft: #2a2316; --sea: #9dbbe0; --sea-soft: #172338;
  --pine: #8ccaa8; --pine-soft: #16301f; --warn: #e6a764; --warn-soft: #36270f; --bad: #ef8f8f; --bad-soft: #3a1c1c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.inner { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -0.02em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.meta { font-size: 12px; color: var(--muted); letter-spacing: .02em; }

/* ── Hero ── */
.hero { position: relative; overflow: hidden; color: var(--hero-ink);
  background:
    radial-gradient(ellipse 60% 55% at 78% 100%, rgba(231,182,121,.55), transparent 70%),
    linear-gradient(180deg, var(--hero-top) 0%, var(--hero-mid) 72%, #3b4a63 100%); }
.hero::before { /* 수평선의 해 */
  content: ""; position: absolute; width: 140px; height: 140px; right: 14%; bottom: -70px; border-radius: 50%;
  background: radial-gradient(circle, #ffe2b3 0%, var(--hero-glow) 45%, rgba(231,182,121,0) 72%); }
.hero::after { /* 바다 물결 */
  content: ""; position: absolute; inset: auto 0 0 0; height: 46px;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,.07) 0 1px, transparent 1px 7px), linear-gradient(180deg, rgba(10,19,36,.0), rgba(10,19,36,.55)); }
.hero .inner { position: relative; z-index: 1; padding-block: 44px 64px; display: grid; gap: 26px; }
.hero .kicker { font-family: var(--font-accent); font-style: italic; font-size: 20px; color: var(--hero-glow); letter-spacing: .04em; }
.hero h1 { font-size: clamp(34px, 6vw, 54px); font-weight: 700; line-height: 1.15; }
.hero .lede { color: var(--hero-muted); max-width: 46ch; margin: 8px 0 0; }
.hero-row { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: end; justify-content: space-between; }
.cond { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.field { display: grid; gap: 6px; }
.field .lbl { font-size: 11px; letter-spacing: .16em; color: var(--hero-muted); font-weight: 500; }
.hero input[type=date] { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); color: var(--hero-ink); border-radius: 999px; padding: 7px 14px; color-scheme: dark; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 15px; font-size: 14px; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--surface); }
.hero .seg { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); }
.hero .seg button { color: var(--hero-ink); }
.hero .seg button[aria-pressed=true] { background: var(--hero-ink); color: var(--hero-top); }
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.days button { flex: none; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: var(--hero-ink); border-radius: 12px; padding: 8px 14px; text-align: left; font-family: var(--font-display); font-size: 15px; font-weight: 600; line-height: 1.3; }
.days button small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 400; color: var(--hero-muted); }
.days button[aria-pressed=true] { background: var(--hero-ink); color: var(--hero-top); border-color: var(--hero-ink); }
.days button[aria-pressed=true] small { color: var(--hero-top); opacity: .7; }
.days.regions button { font-size: 14px; padding: 6px 12px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: baseline; }
.days.regions button small { display: inline; }
#localBtn[aria-pressed=true] { background: var(--pine); border-color: var(--pine); color: var(--surface); }
#trendBtn[aria-pressed=true] { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.today { text-align: right; font-size: 13px; color: var(--hero-muted); font-variant-numeric: tabular-nums; line-height: 1.7; }
.today b { color: var(--hero-ink); font-family: var(--font-display); font-size: 17px; font-weight: 600; }

/* ── Tabs ── */
.tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
nav.tabs { display: flex; gap: 6px; overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 15px 14px 13px; font-family: var(--font-display); font-size: 16px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--brass); }
nav.tabs .count { font-family: var(--font-body); font-size: 11px; background: var(--brass-soft); color: var(--brass); border-radius: 999px; padding: 1px 7px; margin-left: 4px; font-variant-numeric: tabular-nums; vertical-align: 2px; }
main.inner { padding-block: 32px 64px; }
section.panel { display: grid; gap: 24px; }

.notice { font-size: 13px; color: var(--muted); border-left: 2px solid var(--brass); padding: 2px 0 2px 12px; margin: 0; }
.sec-title { display: flex; align-items: baseline; gap: 12px; }
.sec-title h2 { font-size: 24px; }
.sec-title .en { font-family: var(--font-accent); font-style: italic; color: var(--brass); font-size: 18px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--muted); }
.chipbtn:hover { color: var(--ink); border-color: var(--muted); }
.chipbtn[aria-pressed=true] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.filters .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
#dealBtn[aria-pressed=true] { background: var(--brass); border-color: var(--brass); color: var(--surface); }
.search { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 10px 2px; font-size: 16px; }
.search:focus { outline: none; border-bottom-color: var(--brass); }

/* Hot */
.hot ol { margin: 14px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.hot li { padding: 16px 18px 16px 0; display: grid; gap: 4px; border-bottom: 1px solid var(--line); }
.hot li .hp { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; margin-bottom: 8px; background: var(--line); }
.heroph { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 120px; gap: 10px; }
.heroph figure { margin: 0; position: relative; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,.08); }
.heroph figure:first-child { grid-column: span 2; grid-row: span 2; }
.heroph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.heroph figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 6px; font-size: 12px; color: #fff; background: linear-gradient(180deg, transparent, rgba(0,0,0,.6)); }
.heroph figcaption b { display: block; font-family: var(--font-display); font-size: 14px; }
.herocredit { font-size: 10px; color: var(--hero-muted); }
.herocredit a { color: inherit; }
@media (max-width: 640px) { .heroph { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 96px; } .heroph figure:nth-child(n+4) { display: none; } }
.season { margin: 0 0 30px; }
.season .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px; margin-bottom: 12px; }
.season .lede { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
.srow { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 230px); gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
.spick { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-rows: auto 1fr; scroll-snap-align: start; }
.spick .ph { aspect-ratio: 16/10; background: linear-gradient(135deg, var(--sea-soft), var(--brass-soft)); display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.hpw { position: relative; display: block; }
.spick .ph { position: relative; }
.spick .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.spick .bd { padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.spick .when { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--brass); }
.spick b { font-family: var(--font-display); font-size: 16px; line-height: 1.3; }
.spick .why { font-size: 13px; color: var(--ink); }
.spick .meta { font-size: 12px; }
.spick .btn { justify-self: start; margin-top: 6px; padding: 5px 12px; font-size: 12px; }
.seasonpill { background: var(--brass-soft); color: var(--brass); }
.hot li .rk { font-family: var(--font-accent); font-style: italic; font-size: 22px; color: var(--brass); line-height: 1; }
.hot li b { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.hot li span:last-child { font-size: 13px; color: var(--muted); }

/* Cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 18px; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px 22px 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.card .head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.eyebrow { font-size: 11px; letter-spacing: .16em; color: var(--brass); font-weight: 600; margin-bottom: 4px; }
.card h3 { font-size: 22px; line-height: 1.3; }
.badges { display: flex; flex-direction: column; align-items: end; gap: 6px; }
.pill { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; border: 1px solid currentColor; }
.pill.ok { color: var(--pine); }
.pill.closed { color: var(--bad); background: var(--bad-soft); }
.pill.check { color: var(--warn); }
.pill.hotpill { color: var(--bad); }
.ic { width: 14px; height: 14px; flex: none; }
.dealbadge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--surface); background: var(--brass); border-radius: 999px; padding: 3px 10px 3px 8px; white-space: nowrap; }
.dealbox { display: flex; gap: 10px; align-items: start; background: var(--brass-soft); color: var(--brass); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.dealbox .ic { margin-top: 3px; }
.dealbox div { display: grid; gap: 1px; min-width: 0; }
.dealbox span { color: var(--ink); }
dl.kv { margin: 0; display: grid; grid-template-columns: 58px 1fr; gap: 6px 12px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
dl.kv dt { color: var(--muted); font-size: 12px; padding-top: 2px; }
dl.kv dd { margin: 0; min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 12px; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
.links a { color: var(--sea); text-decoration: none; border-bottom: 1px solid transparent; }
.links a:hover { border-bottom-color: currentColor; }
.links a.primary { color: var(--brass); font-weight: 600; }
.links a span { font-size: 11px; margin-left: 2px; }
.card .actions { display: flex; gap: 8px; padding-top: 4px; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.added { background: var(--pine-soft); color: var(--pine); border-color: transparent; }
.card { position: relative; }
.card .btn { flex: 1; justify-content: center; padding-inline: 10px; }

/* Stamp & journal */
.seal-mark { position: absolute; right: 18px; top: 64px; width: 78px; height: 78px; border-radius: 50%; border: 3px double var(--brass); color: var(--brass); background: color-mix(in srgb, var(--brass-soft) 85%, transparent); display: grid; place-content: center; text-align: center; font-family: var(--font-display); font-size: 12px; font-weight: 700; line-height: 1.2; transform: rotate(-12deg); pointer-events: none; padding: 6px; }
.seal-mark small { display: block; font-family: var(--font-accent); font-style: italic; font-weight: 500; font-size: 13px; }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px; }
.seal { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1.5px dashed var(--line); background: var(--surface); color: var(--muted); display: grid; place-content: center; text-align: center; gap: 2px; padding: 10px; font-family: var(--font-display); font-size: 13px; line-height: 1.25; }
.seal small { font-family: var(--font-body); font-size: 11px; color: var(--muted); }
.seal:hover { border-color: var(--brass); }
.seal.on { border: 3px double var(--brass); background: var(--brass-soft); color: var(--brass); font-weight: 700; transform: rotate(-8deg); }
.seal.on small { color: var(--brass); font-family: var(--font-accent); font-style: italic; font-size: 13px; }

/* 수익 모델 표시(₩) */
.revmark { display: inline-grid; place-items: center; flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--brass); color: var(--surface); font: 700 11px/1 var(--font-body); margin-right: 6px; vertical-align: -3px; }
body.hide-rev .revmark, body.hide-rev .revonly { display: none !important; }
/* 앱(APK) 판: 서버가 필요한 문의·광고·AI·응모 기능은 숨긴다 */
body.apk .revbox, body.apk .ownerline, body.apk #saveBtn { display: none !important; }
.revbox { border: 1.5px dashed var(--brass); border-radius: var(--r); padding: 20px; background: color-mix(in srgb, var(--brass-soft) 45%, var(--surface)); display: grid; gap: 10px; margin-bottom: 22px; }
.revbox h2, .revbox h3 { font-size: 19px; display: flex; align-items: center; }
.revbox p { margin: 0; font-size: 14px; }
.adpill { font-size: 11px; border: 1px solid var(--muted); color: var(--muted); border-radius: 4px; padding: 1px 6px; letter-spacing: .05em; }
.ktopill { background: var(--sea-soft); color: var(--sea); }
.thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: var(--line); display: block; }
.photo { margin: 0; display: grid; gap: 4px; position: relative; }
.phtag { position: absolute; left: 8px; top: 8px; z-index: 1; font-size: 11px; font-weight: 600; color: #fff; background: rgba(19,25,37,.72); border-radius: 999px; padding: 2px 9px; }
.photo figcaption { font-size: 11px; color: var(--muted); line-height: 1.4; }
.photo figcaption a { color: inherit; }
.photoadd { display: inline-flex; align-items: center; gap: 4px; }
.ownerline { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--sea); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
.sponsors { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.sponsor { background: var(--surface); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; font-size: 13px; }
.sponsor b { font-family: var(--font-display); font-size: 16px; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.formgrid input, .formgrid select, .revbox textarea, .ops input { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 14px; min-width: 0; width: 100%; }
.revbox textarea { min-height: 90px; }
.okline { font-size: 13px; color: var(--pine); }
.errline { font-size: 13px; color: var(--bad); }
.ops table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ops th, .ops td { text-align: left; border-bottom: 1px solid var(--line); padding: 8px 6px; vertical-align: top; }
.ops .wrap { overflow-x: auto; }
.featlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
.featlist li { display: flex; gap: 6px; align-items: baseline; }
/* 수익 파이프라인 */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpis div { background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 12px; color: var(--muted); }
.kpis b { display: block; font-family: var(--font-display); font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
.pipe { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(190px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.pcol { background: var(--surface); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.pcol h4 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; gap: 6px; }
.pcol h4 small { font-weight: 400; color: var(--muted); font-size: 11px; }
.dcard { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 12px; display: grid; gap: 3px; background: var(--bg); }
.dcard b { font-size: 14px; }
.dcard .due { color: var(--warn); }
.dcard .ctl { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.dcard .ctl button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 8px; font-size: 11px; color: var(--muted); }

function normPlace(p){
  const r = REG[p.region] ? p.region : "gangneung";
  return { id:p.id, region:r, name:String(p.name||"").trim(), cat:p.cat||"맛집", area:p.area||REG[r].name,
    lat:+p.lat || REG[r].lat, lng:+p.lng || REG[r].lng, sig:p.sig||"", hours:p.hours||"현장 확인", fee:p.fee||"현장 확인",

}
OWNER.places = OWNER.places.map(normPlace);
OWNER.places.forEach(p=>{ PLACES.push(p); if (!META[p.id]) META[p.id] = { o:null, c:null, stay:60, cost:0 }; });
const ALL_PLACES = PLACES.slice();
const HIDDEN = new Set(OWNER.hidden);
function applyOwner(){
  const keep = PLACES.filter(p=>!ALL_PLACES.includes(p));          // 관광공사 등 나중에 더해진 장소는 그대로 둔다
  PLACES.length = 0;
  ALL_PLACES.forEach(p=>{ if (!HIDDEN.has(p.id)) PLACES.push(p); });
  keep.forEach(p=>PLACES.push(p));
}

const orderIdx = id => { const i = OWNER.order.indexOf(id); return i<0 ? 1e9 : i; };

  .sort((a,b)=>orderIdx(a.id)-orderIdx(b.id) || (b.who.가족+b.who.친구)-(a.who.가족+a.who.친구) || a.name.localeCompare(b.name));
function pmMove(id, dir){
  const list = pmList().map(p=>p.id), i = list.indexOf(id), j = i+dir;
  if (i<0 || j<0 || j>=list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  const rest = OWNER.order.filter(x=>!list.includes(x));
  OWNER.order = [...list, ...rest];
  PM.dirty = true;
}

const ownerJson = () => JSON.stringify({ v:1, places:ALL_PLACES.filter(p=>p.custom).map(({custom, ...rest})=>rest), hidden:[...HIDDEN], order:OWNER.order });

function pmReadForm(){
  const v = id => (document.getElementById(id)?.value || "").trim();

  const days = ["일","월","화","수","목","금","토"];

  return normPlace({ ...base, id: base.id || ("c-" + Date.now().toString(36)), name:v("pmName"), cat:v("pmCat"), region:v("pmRegion"), area:v("pmArea"),

// 이 페이지의 원본을 가져와 ownerData 부분만 바꿔 새 버전으로 저장한다
async function pmSourceHtml(){
  for (const u of ["index.html", location.pathname]){
    try {
      const r = await fetch(u, { cache:"no-store" }); if (!r.ok) continue;
      let t = await r.text(); const i = t.search(/<!doctype html/i); if (i<0) continue;
      t = t.slice(i);
      if (/<script id="ownerData" type="application\/json">/.test(t) && t.includes('id="tab-places"')) return t;
    } catch(_) {}
  }
  return null;
}
async function pmSave(){
  PM.busy = true; PM.err = PM.msg = ""; renderOps();
  try {
    const art = await useCap("artifact");
    if (!art) throw { code:"not_granted" };
    const src = await pmSourceHtml();
    if (!src) throw { code:"no_source" };
    const data = ownerJson().replace(/</g, "\\u003c");
    const html = src.replace(/<script id="ownerData" type="application\/json">[\s\S]*?<\/script>/, ()=>`<script id="ownerData" type="application/json">${data}<\/script>`);
    await art.publish(html);
    PM.dirty = false; PM.msg = "저장했어요. 잠시 뒤 새 버전으로 다시 열려요.";
  } catch(e) {
    const c = e && e.code;
    PM.err = c==="conflict" ? "그사이 페이지가 새로 저장되어 다시 불러와요. 변경을 다시 해 주세요."
      : (c==="not_writer"||c==="not_granted"||c==="not_declared") ? "이 화면에서는 저장할 수 없어요. 페이지 주인 계정으로 연 화면에서 저장하세요."
      : c==="no_source" ? "페이지 원본을 불러오지 못했어요. 아래 '운영 데이터 복사'를 Claude에게 보내 주세요."
      : c==="rate_limited" ? "저장이 너무 잦아요. 잠시 뒤 다시 눌러 주세요."
      : "저장하지 못했어요. 잠시 뒤 다시 시도하거나 운영 데이터를 복사해 Claude에게 보내 주세요.";
  }
  PM.busy = false; renderOps();
}

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-pm]"); if (!b) return;
  const a = b.dataset.pm, id = b.dataset.id; PM.msg = PM.err = "";
  if (a==="new"){ PM.edit = { region:PM.region, cat: PM.cat==="전체" ? "맛집" : PM.cat }; renderOps(); document.getElementById("pmName")?.focus(); return; }
  if (a==="cancel"){ PM.edit = null; renderOps(); return; }
  if (a==="up" || a==="down"){ pmMove(id, a==="up" ? -1 : 1); pmRerender(); return; }
  if (a==="hide"){ HIDDEN.has(id) ? HIDDEN.delete(id) : HIDDEN.add(id); applyOwner(); PM.dirty = true; pmRerender(); return; }
  if (a==="edit"){ PM.edit = { ...ALL_PLACES.find(p=>p.id===id) }; renderOps(); document.getElementById("pmForm")?.scrollIntoView({ block:"start" }); return; }
  if (a==="del"){
    if (b.dataset.sure!=="1"){ b.dataset.sure = "1"; b.textContent = "한 번 더 누르면 삭제"; return; }
    const i = ALL_PLACES.findIndex(p=>p.id===id); if (i>=0) ALL_PLACES.splice(i,1);
    OWNER.order = OWNER.order.filter(x=>x!==id); HIDDEN.delete(id);
    state.course = state.course.filter(x=>x!==id); applyOwner(); PM.dirty = true; pmRerender(); return; }
  if (a==="save"){ pmSave(); return; }
  if (a==="reset"){ location.reload(); return; }
});
document.addEventListener("submit", e=>{
  if (e.target.id!=="pmForm") return; e.preventDefault();

  if (i>=0) Object.assign(ALL_PLACES[i], p); else { ALL_PLACES.push(p); META[p.id] = { o:null, c:null, stay:60, cost:0 }; }
  if (!OWNER.order.includes(p.id)){ const list = pmList().map(x=>x.id).filter(x=>x!==p.id); OWNER.order = [p.id, ...list, ...OWNER.order.filter(x=>!list.includes(x) && x!==p.id)]; }
  PM.region = p.region; PM.edit = null; PM.dirty = true; PM.msg = `‘${p.name}’을(를) 목록 맨 위에 넣었어요. 저장해야 공개돼요.`;

});

const PHOTO_KIND = { menu:"메뉴 예시 사진", area:"주변 풍경 사진", item:"분위기 예시 사진" };
const httpsUrl = u => String(u||"").replace(/^http:\/\//, "https://");
// 우선순위: 위키미디어 공용 > 관광공사 > 운영자가 올린 사진
function photoFor(p){
  const c = PHOTOS[p.id];
  if (c) { const tag = PHOTO_KIND[c.kind] || "";
    return { url:c.url, tag, example:!!tag, credit:`${tag ? tag+" · " : ""}사진: ${c.artist || "작가 미상"} · ${c.license} · `, link:c.page, linkText:"위키미디어 공용", artist:c.artist }; }
  const k = KTO_PHOTOS[p.id] || (p.img ? { url:p.img } : null);
  if (k) return { url:httpsUrl(k.url), credit:"사진: 한국관광공사 · 공공누리 제1유형(출처 표시)", artist:"한국관광공사" };
  const up = state.uploads[p.id];
  if (up && up.url) return { url:up.url, credit:up.credit || "운영자 등록 사진", artist:"운영자 등록" };
  return null;
}

  const key = state.region+"|"+state.who+"|"+Object.keys(state.uploads).length;
  if (el.dataset.key===key) return; el.dataset.key = key;
  const list = regionPlaces().filter(p=>{ const ph = photoFor(p); return ph && !ph.example; }).sort((a,b)=>b.who[state.who]-a.who[state.who] || a.name.localeCompare(b.name)).slice(0,5);
  el.hidden = !list.length;
  el.innerHTML = list.length ? `<div class="heroph">${list.map(p=>{ const ph = photoFor(p);
      return `<figure><img src="${esc(ph.url)}" alt="${esc(p.name)}" loading="lazy"><figcaption><b>${esc(shortName(p))}</b>${esc(where(p))}</figcaption></figure>`; }).join("")}</div>

}
function photoHtml(p){
  const ph = photoFor(p);
  if (!ph) return "";

    <figcaption>${esc(ph.credit)}${ph.link?`<a href="${esc(ph.link)}" target="_blank" rel="noopener">${ph.linkText}</a>`:""}</figcaption></figure>`;
}

const KTO_SIGUNGU = { gangneung:[1], sokcho:[5,2], yangyang:[7], donghae:[3,4], pyeongchang:[15], jeongseon:[11,8], chuncheon:[13], wonju:[9], inje:[10], hongcheon:[16], hwacheon:[17] };
const KTO_TYPES = { 12:"관광지", 14:"역사", 28:"체험", 38:"소품샵", 39:"맛집", 32:"숙소" };
const stripTags = v => String(v||"").replace(/<br\s*\/?>/gi," ").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
const normName = v => String(v||"").replace(/[\s·()（）]/g,"");
function ktoRegion(it){ return Object.keys(KTO_SIGUNGU).find(r=>KTO_SIGUNGU[r].includes(+it.sigungucode)); }
function ktoToPlace(it){
  const region = ktoRegion(it), lat = +it.mapy, lng = +it.mapx;
  if (!region || !lat || !lng) return null;
  const rest = stripTags(it.restdate), closed = /연중무휴|없음/.test(rest) ? [] : WD.map((w,i)=>rest.includes(w+"요일")?i:-1).filter(i=>i>=0);

// 스냅샷 + 이 기기에서 불러온 캐시를 기존 목록에 합친다(이름이 같으면 직접 정리한 정보를 우선)
function mergeKto(items){
  let n = 0;
  const names = new Set([...PLACES, ...LODGING].map(x=>normName(x.name)));
  items.forEach(it=>{
    const x = String(it.contenttypeid)==="32" ? ktoToStay(it) : ktoToPlace(it);
    if (!x || names.has(normName(x.name)) || [...PLACES, ...LODGING].some(y=>y.id===x.id)) return;
    names.add(normName(x.name)); n++;
    if (x.type) LODGING.push(x); else { PLACES.push(x); META[x.id] = { o:null, c:null, stay:60, cost:0 }; }
  });
  return n;
}
async function ktoFetch(key, region){
  const k = key.includes("%") ? key : encodeURIComponent(key), out = [];
  for (const sg of KTO_SIGUNGU[region]) for (const ct of Object.keys(KTO_TYPES)) {
    const u = `${KTO_BASE}/areaBasedList2?serviceKey=${k}&MobileOS=ETC&MobileApp=GangwonTrip&_type=json&numOfRows=20&pageNo=1&arrange=Q&areaCode=32&sigunguCode=${sg}&contentTypeId=${ct}`;
    const r = await fetch(u); if (!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json(), head = j && j.response && j.response.header;
    if (head && head.resultCode && head.resultCode!=="0000") throw new Error(head.resultMsg || head.resultCode);
    let items = (j.response && j.response.body && j.response.body.items && j.response.body.items.item) || [];
    if (!Array.isArray(items)) items = [items];
    out.push(...items);
  }
  return out;
}

function sunTimes(date, at){
  const { lat, lng } = at || REG.gangneung, rad=Math.PI/180;
  const N = Math.round((date - new Date(date.getFullYear(),0,0))/864e5), g = 2*Math.PI/365*(N-1);
  const eqt = 229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const decl = 0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const ha = Math.acos(Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(decl)) - Math.tan(lat*rad)*Math.tan(decl))/rad;
  return { rise: 720-4*(lng+ha)-eqt+540, set: 720-4*(lng-ha)-eqt+540 };
}

function km(a,b){
  const R=6371, r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat), dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h)) * 1.35; // 직선거리 × 도로 보정
}

  while(left.length){

  }

}

function computeCourse(){
  const st = startPt();
  const stops = state.course.map(byId).filter(Boolean);
  const seq = [st, ...stops], legs = [];
  for (let i=1;i<seq.length;i++) legs.push(km(seq[i-1],seq[i]));
  const total = legs.reduce((a,d)=>a+d,0);
  const mv = d => state.mode==="car" ? carMin(d) : busMin(d);
  const [h,m] = String(state.startTime).split(":").map(Number);
  let t = (isNaN(h)?9:h)*60 + (isNaN(m)?0:m); const rows = [];
  stops.forEach((p,i)=>{
    t += mv(legs[i]); const M = META[p.id]; let warn = "";
    if (M.o!=null && t < M.o*60){ warn = `${M.o}시 개장이라 ${M.o*60-t}분 기다려요`; t = M.o*60; }
    const arrive = t; t += M.stay;
    if (M.c!=null && arrive >= M.c*60) warn = `도착 시각이 마감(${M.c}시) 이후예요. 순서를 앞으로 옮기세요`;
    else if (M.c!=null && t > M.c*60) warn = `마감이 ${M.c}시라 ${M.c*60-arrive}분밖에 못 머물러요`;
    rows.push({ arrive, leave:t, warn });
  });
  const cost = stops.reduce((a,p)=>a+META[p.id].cost,0) * state.people;
  return { st, stops, seq, legs, total, mv, rows, end:t, cost };
}

function renderPack(){
  // 준비물은 여행 전체 일차의 코스를 합쳐서 판단
  const stops = [...new Set([...Object.values(state.courses).flat(), ...state.course])].map(byId).filter(Boolean);
  const m = tripDay().getMonth()+1;
  const season = (m>=11||m<=3) ? { id:"winter", title:"겨울철", why:`${m}월 강원은 바닷바람·산바람이 차가워요`, items:["패딩 · 목도리","장갑","핫팩","립밤 · 보습제"] }
               : (m>=6&&m<=8) ? { id:"summer", title:"여름철", why:"해수욕 시즌", items:["수영복 · 래시가드","방수팩","모기 기피제","양산 · 모자"] }
               : { id:"mid", title:"환절기", why:"일교차가 커요", items:["얇은 겉옷","긴팔 한 벌"] };
  const groups = [PACKS[0], season, ...PACKS.slice(1).filter(g=> g.whoOnly ? g.whoOnly===state.who : stops.some(g.when))];
  const all = groups.flatMap(g=>g.items.map(it=>g.id+"|"+it));
  const done = all.filter(k=>state.checks[k]).length;
  document.getElementById("tab-pack").innerHTML = `
    <div class="progress">${done} / ${all.length} 챙김 — 내 코스·날짜·동행에 맞춰 목록이 바뀌어요.<div class="bar"><i style="width:${all.length?done/all.length*100:0}%"></i></div></div>
    <div class="packs">${groups.map(g=>`<div class="pack"><h3>${g.title}</h3><div class="why">${g.why}</div>
      ${g.items.map(it=>{ const k=g.id+"|"+it, on=!!state.checks[k], id="ck_"+btoa(unescape(encodeURIComponent(k))).replace(/[^a-z0-9]/gi,"");
        return `<label class="${on?"done":""}" for="${id}"><input type="checkbox" id="${id}" data-ck="${esc(k)}" ${on?"checked":""}><span>${it}</span></label>`; }).join("")}
    </div>`).join("")}</div>`;
}

async function appendMine(col, item){
  if (RT.db && RT.uid){
    const ref = RT.db.doc(col+"/"+RT.uid), cur = await ref.get();
    const items = cur.exists ? [...((cur.data()||{}).items||[])] : [];
    items.push(item);
    await ref.set({ items: items.slice(-50), at: new Date().toISOString() });
    return "server";
  }

}

let opsSubscribed = false;
function subscribeOps(){
  if (opsSubscribed) return; opsSubscribed = true;
  const timer = setTimeout(()=>{ state.ops.note = "운영 데이터를 아직 불러오지 못했어요. 잠시 뒤 다시 확인하세요."; renderOps(); }, 10000);
  [["inquiries","inquiries"],["clicks","clicks"],["stampclaims","claims"],["deals","deals"]].forEach(([col,key])=>{
    RT.db.collection(col).onSnapshot(snap=>{
      if (!snap.metadata.fromCache){ clearTimeout(timer); state.ops.note = ""; }
      state.ops[key] = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) })); renderOps();
    }, e=>{ clearTimeout(timer); state.ops.note = "운영 데이터를 읽지 못했어요 ("+e.code+")"; renderOps(); });
  });
}

      ${e ? `<form id="dealForm" class="wallet" style="display:grid;gap:10px">
        <h3 style="font-size:17px">${e.id?"거래 수정":"새 거래"}</h3>

          <select id="dModel" aria-label="수익 모델">${MODELS.map(m=>`<option ${m===e.model?"selected":""}>${m}</option>`).join("")}</select>
          <select id="dStage" aria-label="단계">${STAGES.map(st=>`<option value="${st.id}" ${st.id===(e.stage||"lead")?"selected":""}>${st.name}</option>`).join("")}</select>
          <input id="dAmount" type="number" min="0" step="10000" placeholder="월 예상 금액(원)" value="${esc(e.amount||"")}" aria-label="월 예상 금액">
          <input id="dNext" placeholder="다음 할 일 (예: 제안서 보내기)" value="${esc(e.next||"")}" aria-label="다음 할 일">
          <input id="dDue" type="date" value="${esc(e.due||"")}" aria-label="할 일 날짜">
        </div>
        <textarea id="dMemo" placeholder="메모 (담당자, 조건, 연락 기록)" style="min-height:70px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px" aria-label="메모">${esc(e.memo||"")}</textarea>
        <div class="cbar" style="margin:0"><button class="btn">저장</button><button type="button" class="btn ghost" data-dcancel="1">닫기</button></div>
      </form>` : ""}
      <details class="playbook"><summary>단계별 할 일 (영업 플레이북)</summary>
        <ol>${STAGES.map(st=>`<li><b>${st.name}</b> (성사 확률 ${Math.round(st.p*100)}%) — ${st.todo}</li>`).join("")}</ol>
        <p class="meta" style="margin-top:8px">가중 예상 월매출 = 진행 중 거래의 월 예상 금액 × 단계별 성사 확률의 합이에요. 리드는 아래 ‘문의·제보’에서 ‘파이프라인에 추가’로 바로 넣을 수 있어요.</p>
      </details>
    </div>`;
}

function renderOps(){
  const el = document.getElementById("tab-ops");
  if (!state.isOps){ el.innerHTML = ""; return; }
  const local = !RT.db;
  const inq = (local ? [{ items:store.get("local_inquiries", []) }] : state.ops.inquiries)
    .flatMap(d=>d.items||[]).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  state.ops.inqFlat = inq;
  const agg = {};
  (local ? [{ counts:state.clicks }] : state.ops.clicks).forEach(d=>Object.entries(d.counts||{}).forEach(([k,v])=>agg[k]=(agg[k]||0)+v));
  const claims = (local ? [{ items:store.get("local_stampclaims", []) }] : state.ops.claims).flatMap(d=>d.items||[]);
  const sum = pre => Object.entries(agg).filter(([k])=>k.startsWith(pre)).reduce((a,[,v])=>a+v,0);
  const cnt = t => inq.filter(x=>x.type===t).length;
  const feats = [
    ["숙소 제휴 예약 링크", "제휴 수수료", PARTNERS.stay.link ? "제휴 링크 연결됨" : "제휴 링크 미설정 · 지금은 일반 검색으로 연결", `클릭 ${sum("stay:")}`],
    ["티켓·체험 예매 링크", "제휴 수수료", PARTNERS.ticket.link ? "제휴 링크 연결됨" : "제휴 링크 미설정 · 지금은 일반 검색으로 연결", `클릭 ${sum("ticket:")}`],
    ["추천 가게(광고) 노출", "광고비", `${SPONSORED.length}곳 노출 중`, `클릭 ${sum("ad:")}`],
    ["제휴 쿠폰", "가게 제휴비", `${PARTNER_COUPONS.filter(c=>!c.demo).length}개 운영 · 예시 ${PARTNER_COUPONS.filter(c=>c.demo).length}개`, `받기 ${sum("coupon:")}`],
    ["입점·광고·제휴 문의", "영업 창구", "문의 폼 운영 중", `문의 ${inq.filter(x=>REV_TYPES.has(x.type)).length}`],
    ["업주 정보 수정(업주 인증)", "유료 전환 창구", "카드마다 ‘사장님이신가요?’ 링크", `요청 ${cnt("업주 정보 수정")}`],
    ["AI 맞춤 코스", "프리미엄 구독 후보", "Claude 앱에서 동작", ""],
    ["코스 파일 저장", "프리미엄 구독 후보", "동작 중", ""],
    ["지자체 스탬프 투어", "지자체 사업(B2G)", "완주 인증·응모 예시", `응모 ${claims.length}`],
    ["클릭 통계", "광고 영업 지표", "수익 링크 클릭을 집계", `합계 ${Object.values(agg).reduce((a,v)=>a+v,0)}`],
    ["수익 파이프라인", "영업 관리", "리드→연락→제안→계약→운영 중", `거래 ${dealsList().length}`],
  ];
  el.innerHTML = `${placeManager()}
    <p class="notice">이 탭은 운영자(이 페이지 소유자)에게만 보여요.${local?" 지금은 로컬 미리보기라 문의·통계가 이 기기에만 저장돼요.":""}${state.ops.note?" "+esc(state.ops.note):""}</p>
    <div class="revbox"><h2>${REV}수익 모델 기능</h2>
      <p class="meta">₩ 표시가 붙은 기능이 수익으로 이어질 수 있는 곳이에요. 사용자에게 보여 줄 때는 표시를 끌 수 있어요.</p>
      <div class="wrap"><table><thead><tr><th>기능</th><th>수익 방식</th><th>상태</th><th>지표</th></tr></thead>
        <tbody>${feats.map(f=>`<tr><td>${REV}${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td><td>${f[3]}</td></tr>`).join("")}</tbody></table></div>
      <button class="btn ghost" style="justify-self:start" id="revToggle">${state.showRev?"₩ 표시 끄기":"₩ 표시 켜기"}</button>
    </div>
    ${renderPipeline()}
    <div class="sec-title"><h2>한국관광공사 TourAPI</h2><span class="en">Official data</span></div>
    <div class="wallet" style="margin-bottom:22px">
      <p class="meta">공식 데이터 스냅샷 ${KTO_SNAPSHOT.length}건 · 이 기기에서 불러온 캐시 ${KTO_CACHE.length}건 · 목록에 추가된 장소·숙소 ${KTO_ADDED}곳 (직접 정리한 곳과 이름이 같으면 빼요)</p>
      <p style="font-size:14px;margin:10px 0">① 공공데이터포털(data.go.kr)에서 ‘한국관광공사_국문 관광정보 서비스_GW’를 활용 신청해 일반 인증키를 받아요. ② 프로젝트 폴더에서 <code>python tools/tourapi_sync.py --key 인증키</code>를 실행하면 강원 10개 지역의 관광지·문화시설·레포츠·쇼핑·음식점·숙박 정보와 휴무·이용시간이 이 페이지에 들어가요. ③ 다시 게시하면 모든 사용자에게 보여요.</p>
      <form id="ktoForm" class="formgrid" style="margin-top:6px">
        <input type="password" id="ktoKey" placeholder="인증키 (이 기기에만 저장)" value="${esc(state.kto.key)}" aria-label="TourAPI 인증키" autocomplete="off">
        <button class="btn" ${state.kto.busy?"disabled":""}>${state.kto.busy?"불러오는 중…":(state.region==="all"?"지역을 먼저 고르세요":REG[state.region].name+" 바로 불러오기")}</button>
      </form>
      ${state.kto.msg?`<p class="meta" style="margin-top:8px">${esc(state.kto.msg)}</p>`:""}
      <p class="meta" style="margin-top:8px">바로 불러오기는 이 기기 화면에만 더해져요. 브라우저 보안 정책(CORS)으로 막히면 위 ②의 스크립트를 쓰세요. 인증키는 다른 사람과 공유하지 마세요.</p>
    </div>
    <div class="sec-title"><h2>문의·제보</h2><span class="en">${inq.length} received</span></div>
    ${inq.length ? `<div class="wrap"><table><thead><tr><th>날짜</th><th>유형</th><th>가게·장소</th><th>연락처</th><th>내용</th><th></th></tr></thead><tbody>
      ${inq.map((x,i)=>`<tr><td>${esc(String(x.at||"").slice(0,10))}</td><td>${REV_TYPES.has(x.type)?REV:""}${esc(x.type)}</td><td>${esc(x.place)}</td><td>${esc(x.contact||"")}</td><td>${esc(x.msg)}</td><td>${REV_TYPES.has(x.type)?`<button class="linkbtn" data-dfrom="${i}">파이프라인에 추가</button>`:""}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty">아직 받은 문의가 없어요.</div>`}
    <div class="sec-title"><h2>수익 링크 클릭</h2><span class="en">Clicks</span></div>
    ${Object.keys(agg).length ? `<div class="wrap"><table><thead><tr><th>링크</th><th>클릭</th></tr></thead><tbody>
      ${Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,40).map(([k,v])=>{ const [kind,id]=k.split(":"), x=byId(id)||LODGING.find(l=>l.id===id)||PARTNER_COUPONS.find(c=>c.id===id);
        return `<tr><td>${({stay:"숙소 예약",ticket:"티켓 예매",ad:"광고",coupon:"쿠폰"})[kind]||kind} · ${esc(x?(x.name||x.title):id)}</td><td>${v}</td></tr>`; }).join("")}</tbody></table></div>`
      : `<div class="empty">아직 집계된 클릭이 없어요.</div>`}
    <div class="sec-title"><h2>스탬프 완주 응모</h2><span class="en">${claims.length} entries</span></div>
    ${claims.length ? `<div class="wrap"><table><thead><tr><th>날짜</th><th>지역</th><th>스탬프 수</th></tr></thead><tbody>
      ${claims.map(c=>`<tr><td>${esc(String(c.at||"").slice(0,10))}</td><td>${esc(c.regionName||c.region)}</td><td>${c.count}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty">아직 응모가 없어요.</div>`}`;
}

function render(){ renderTop(); renderPlaces(); renderSeasonTab(); renderCourse(); renderDeals(); renderOps(); renderPack(); renderJournal(); }

// ───────── 이벤트 ─────────
document.addEventListener("click", e=>{
  const r = e.target.closest("[data-rev]"); if (r) trackRev(r.dataset.rev);
  const t = e.target.closest("button"); if(!t) return;
  if (t.dataset.inquire!==undefined && t.dataset.inqtype){
    const p = byId(t.dataset.inquire);
    state.inq = { type:t.dataset.inqtype, place:p?p.name:"", msg:"", ok:"", err:"" }; state.tab = "deals"; render();
    const f = document.getElementById("inqForm"); if (f) f.scrollIntoView({ block:"start" }); return;
  }
  if (t.dataset.goto){
    state.tab="places"; state.cat="전체"; state.q=""; state.trend=state.local=state.dealOnly=state.rain=false; render();
    const c = document.getElementById("card-"+t.dataset.goto); if (c) c.scrollIntoView({ block:"center" }); return;
  }
  if (t.dataset.coupon){
    const c = PARTNER_COUPONS.find(x=>x.id===t.dataset.coupon); if (!c || state.claimed.includes(c.id)) return;
    state.claimed.push(c.id); state.coupons.push({ t:`${c.shop} ${c.title}`, n:c.cond }); trackRev("coupon:"+c.id); save(); renderDeals(); return;
  }
  if (t.dataset.claim){
    const here = regionPlaces(), ids = here.filter(p=>state.stamps[p.id]).map(p=>p.id);
    t.disabled = true;
    appendMine("stampclaims", { region:state.region, regionName:regionLabel(), count:ids.length, ids, at:new Date().toISOString() })
      .then(()=>{ state.claimMsg = "응모했어요. 당첨 시 안내해 드릴게요."; renderJournal(); })
      .catch(()=>{ t.disabled = false; state.claimMsg = ""; alert("이 화면에서는 응모를 보낼 수 없어요. 참여 권한이 있는 계정으로 열어 주세요."); });
    return;
  }
  if (t.dataset.photodel){
    const id = t.dataset.photodel, old = state.uploads[id];
    if (!old || !RT.db || !confirm("올린 사진을 지울까요?")) return;
    RT.db.doc("photos/"+id).delete().then(()=>{ if (old.assetId && RT.assets) RT.assets.delete(old.assetId).catch(()=>{}); });
    return;
  }
  if (t.dataset.dnew){ state.deal = { stage:"lead", model:MODELS[0], region:state.region==="all"?"gangneung":state.region }; state.dealMsg=""; renderOps(); document.getElementById("dName")?.focus(); return; }
  if (t.dataset.dcancel){ state.deal = null; renderOps(); return; }
  if (t.dataset.dedit){ state.deal = { ...dealsList().find(d=>d.id===t.dataset.dedit) }; state.dealMsg=""; renderOps(); document.getElementById("dealForm")?.scrollIntoView({ block:"center" }); return; }
  if (t.dataset.ddel){ const d = dealsList().find(x=>x.id===t.dataset.ddel); if (d && confirm(`‘${d.name}’ 거래를 지울까요?`)) deleteDeal(d.id).catch(()=>{ state.dealMsg="지우지 못했어요."; renderOps(); }); return; }
  if (t.dataset.dmove){
    const d = dealsList().find(x=>x.id===t.dataset.dmove); if (!d) return;
    const i = Math.max(0, Math.min(STAGES.length-1, STAGES.findIndex(x=>x.id===d.stage) + (+t.dataset.dir)));
    saveDeal({ ...d, stage:STAGES[i].id }).catch(()=>{ state.dealMsg="저장하지 못했어요."; renderOps(); }); return;
  }
  if (t.dataset.dfrom!==undefined){
    const x = (state.ops.inqFlat||[])[+t.dataset.dfrom]; if (!x) return;
    state.deal = { stage:"lead", name:x.place, model:INQ_TO_MODEL[x.type]||MODELS[1], region:REG[x.region]?x.region:"gangneung", next:"첫 연락하기", due:isoLocal(new Date()), memo:`[${x.type}] ${x.msg}${x.contact?" / 연락처 "+x.contact:""}` };
    renderOps(); document.getElementById("dealForm")?.scrollIntoView({ block:"center" }); return;
  }
  if (t.id==="dealCsv"){
    const name = `수익파이프라인-${isoLocal(new Date())}.csv`, data = dealsCsv();
    (async()=>{ RT.downloads = RT.downloads || await useCap("downloads");
      if (RT.downloads){ try { await RT.downloads.save({ filename:name, data }); } catch(_){} return; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type:"text/csv" })); a.download = name; a.click(); })();
    return;
  }
  if (t.id==="revToggle"){ state.showRev = !state.showRev; save(); renderTop(); renderOps(); return; }
  if (t.id==="saveBtn"){ t.disabled = true; saveCourseFile().then(m=>{ t.textContent = m; }); return; }
  if (t.dataset.tab){ state.tab=t.dataset.tab; try{ history.replaceState(null,"","#"+state.tab); }catch(_){} if (state.tab==="ops") renderOps(); renderTop(); keepTabPos(); return; }
  if (t.dataset.region){ state.region=t.dataset.region; const s0=STARTS.find(s=>s.region===state.region); if (s0 && startPt().region!==state.region && !state.course.length) state.start=s0.id; save(); render(); return; }
  if (t.dataset.stay){ state.start = t.dataset.stay; save(); render(); return; }
  if (t.dataset.who){ state.who=t.dataset.who; save(); render(); return; }
  if (t.dataset.cat){ state.cat=t.dataset.cat; renderPlaces(); return; }
  if (t.id==="rainBtn"){ state.rain=!state.rain; renderPlaces(); return; }
  if (t.id==="dealBtn"){ state.dealOnly=!state.dealOnly; renderPlaces(); return; }
  if (t.id==="trendBtn"){ state.trend=!state.trend; renderPlaces(); return; }
  if (t.id==="localBtn"){ state.local=!state.local; renderPlaces(); return; }
  if (t.dataset.day){ switchDay(+t.dataset.day); save(); render(); return; }
  if (t.dataset.stamp){ const id=t.dataset.stamp; if (state.stamps[id]) delete state.stamps[id]; else state.stamps[id]=todayISO; save(); render(); return; }
  if (t.dataset.review || t.dataset.revedit){
    pickReview(t.dataset.review || t.dataset.revedit); state.tab="journal"; render();
    const a=document.getElementById("revAnchor"); if (a) a.scrollIntoView({ block:"start" }); return;
  }
  if (t.dataset.star){
    state.revStar=+t.dataset.star;
    document.querySelectorAll(".stars button").forEach(b=>b.classList.toggle("on", +b.dataset.star<=state.revStar)); return;
  }
  if (t.dataset.revdel){ delete state.reviews[t.dataset.revdel]; save(); render(); return; }
  if (t.dataset.season){ state.season = t.dataset.season===seasonOf(tripDay().getMonth()+1) ? null : t.dataset.season; renderSeasonTab(); return; }
  if (t.dataset.mapfit){ state.mapFit = t.dataset.mapfit; save(); renderCourse(); return; }
  if (t.dataset.mode){ state.mode=t.dataset.mode; save(); renderCourse(); return; }
  if (t.dataset.tpl){ const tp=TEMPLATES[+t.dataset.tpl]; state.course=[...tp.ids]; state.start=tp.start; if (state.region!=="all") state.region=tp.region; save(); render(); return; }
  if (t.id==="copyBtn"){
    const txt = courseText(), out = document.getElementById("copyOut");
    const fallback = ()=>{ out.hidden=false; out.value=txt; out.focus(); out.select(); t.textContent="아래 글을 복사하세요"; };
    try { navigator.clipboard.writeText(txt).then(()=>{ t.textContent="복사됨 ✓"; }, fallback); } catch(_) { fallback(); }
    return;
  }
  if (t.dataset.toggle){ const id=t.dataset.toggle; state.course = state.course.includes(id) ? state.course.filter(x=>x!==id) : [...state.course,id]; save(); render(); return; }
  if (t.dataset.up){ const i=+t.dataset.up, c=state.course; [c[i-1],c[i]]=[c[i],c[i-1]]; save(); render(); return; }
  if (t.dataset.down){ const i=+t.dataset.down, c=state.course; [c[i+1],c[i]]=[c[i],c[i+1]]; save(); render(); return; }
  if (t.id==="optBtn"){ sortNearest(); render(); return; }
  if (t.id==="clearBtn"){ state.course=[]; save(); render(); return; }
  if (t.dataset.cpdel){ state.coupons.splice(+t.dataset.cpdel,1); save(); renderDeals(); return; }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if (t.id==="tripDate"){ state.season=null; state.date=t.value||todayISO; if (state.dateEnd < state.date) state.dateEnd = state.date; clampDay(); save(); render(); }
  if (t.id==="tripDateEnd"){ state.dateEnd = (t.value && t.value >= state.date) ? t.value : state.date; clampDay(); save(); render(); }
  if (t.id==="startSel"){ state.start=t.value; save(); render(); }
  if (t.id==="revPlace"){ pickReview(t.value); renderJournal(); }
  if (t.id==="startTime"){ state.startTime=t.value||"09:00"; save(); renderCourse(); }
  if (t.id==="people"){ state.people=Math.max(1, Math.min(30, parseInt(t.value)||1)); save(); renderCourse(); }
  if (t.dataset.ck){ state.checks[t.dataset.ck]=t.checked; save(); renderPack(); }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if (t.dataset && t.dataset.photo && t.files && t.files[0]){
    const lab = t.closest("label"); if (lab) lab.firstChild.textContent = "올리는 중…";
    uploadPhoto(t.dataset.photo, t.files[0]).catch(()=>{ alert("사진을 올리지 못했어요. 파일 크기(20MB 이하)와 형식을 확인하세요."); renderGrid(); });
  }
});
document.addEventListener("input", e=>{
  if (e.target.id==="q"){ state.q=e.target.value; renderGrid(); }
});
document.addEventListener("submit", e=>{
  if (e.target.id==="aiForm"){
    e.preventDefault(); if (state.ai.busy) return;
    const text = document.getElementById("aiText").value.trim();
    state.ai = { busy:true, text, msg:"", err:"" }; renderCourse();
    aiCourse(text).then(r=>{ state.course = r.ids; sortNearest(); state.ai = { busy:false, text, msg:r.reason || "코스를 짰어요.", err:"" }; save(); render(); })
      .catch(err=>{ const c = err && err.code;
        const m = c==="not_available" ? "AI 코스는 claude.ai에서 열었을 때 쓸 수 있어요." : c==="not_granted" ? "AI 사용을 허용하지 않아 쓸 수 없어요." : c==="rate_limited" ? "요청이 많아요. 잠시 뒤 다시 시도하세요." : "코스를 짜지 못했어요. 요청을 바꿔 다시 시도하세요.";
        state.ai = { busy:false, text, msg:"", err:m }; renderCourse(); });
    return;
  }
  if (e.target.id==="dealForm"){
    e.preventDefault();
    const v = id => document.getElementById(id).value.trim();
    const d = { ...state.deal, id: state.deal.id || "d"+Date.now().toString(36), name:v("dName"), region:v("dRegion"), regionName:REG[v("dRegion")].name,
      model:v("dModel"), stage:v("dStage"), amount:Math.max(0, parseInt(v("dAmount"))||0), next:v("dNext"), due:v("dDue"), memo:v("dMemo") };
    if (!d.name) return;
    d.created = d.created || new Date().toISOString();
    saveDeal(d).then(()=>{ state.deal = null; state.dealMsg = `‘${d.name}’ 저장했어요.`; renderOps(); })
      .catch(()=>{ state.dealMsg = "저장하지 못했어요. 운영자 계정으로 열었는지 확인하세요."; renderOps(); });
    return;
  }
  if (e.target.id==="inqForm"){
    e.preventDefault(); if (state.inq.busy) return;
    const item = { type:document.getElementById("inqType").value, place:document.getElementById("inqPlace").value.trim(),
      contact:document.getElementById("inqContact").value.trim(), msg:document.getElementById("inqMsg").value.trim(), region:state.region, at:new Date().toISOString() };
    if (!item.place || !item.msg) return;
    state.inq = { ...item, busy:true, ok:"", err:"" }; renderDeals();
    appendMine("inquiries", item)
      .then(w=>{ state.inq = { type:item.type, place:"", msg:"", ok: w==="local" ? "이 기기에 저장했어요(로컬 미리보기)." : "보냈어요. 확인 후 연락드릴게요.", err:"" }; renderDeals(); renderOps(); })
      .catch(()=>{ state.inq = { ...item, busy:false, ok:"", err:"이 화면에서는 보낼 수 없어요. 로그인했거나 참여 권한이 있는 계정으로 열어 주세요." }; renderDeals(); });
    return;
  }
  if (e.target.id==="ktoForm"){
    e.preventDefault(); if (state.kto.busy) return;
    const key = document.getElementById("ktoKey").value.trim();
    if (!key){ state.kto.msg = "인증키를 넣어 주세요."; renderOps(); return; }
    if (state.region==="all"){ state.kto.msg = "맨 위에서 지역을 하나 고른 뒤 불러오세요."; renderOps(); return; }
    state.kto = { busy:true, key, msg:"" }; store.set("ktoKey", key); renderOps();
    ktoFetch(key, state.region).then(items=>{
      const slim = items.map(it=>({ contentid:it.contentid, contenttypeid:it.contenttypeid, title:it.title, addr1:it.addr1, mapx:it.mapx, mapy:it.mapy, firstimage:it.firstimage, sigungucode:it.sigungucode, tel:it.tel }));
      const ids = new Set(slim.map(x=>x.contentid));
      KTO_CACHE.splice(0, KTO_CACHE.length, ...KTO_CACHE.filter(x=>!ids.has(x.contentid)), ...slim);
      store.set("ktoCache", KTO_CACHE.slice(-800));
      const n = mergeKto(slim);
      state.kto = { busy:false, key, msg:`${items.length}건을 받아 ${n}곳을 새로 더했어요.` }; render();
    }).catch(err=>{
      state.kto = { busy:false, key, msg:`불러오지 못했어요 (${err && err.message || "네트워크 오류"}). 인증키가 맞는지 확인하고, 브라우저에서 막히면 tools/tourapi_sync.py를 쓰세요.` }; renderOps();
    });
    return;
  }
  if (e.target.id==="revForm"){
    e.preventDefault();
    const id=document.getElementById("revPlace").value, text=document.getElementById("revText").value.trim();
    const date=document.getElementById("revDate").value || todayISO;
    if (!text) return;
    state.reviews[id] = { rating:state.revStar, text, date };
    if (!state.stamps[id]) state.stamps[id] = date;
    save(); render(); return;
  }
  if (e.target.id!=="cpForm") return; e.preventDefault();
  const t=document.getElementById("cpTitle").value.trim(), n=document.getElementById("cpNote").value.trim();
  if(!t) return; state.coupons.push({t,n}); save(); renderDeals();
});

const h = location.hash.replace("#","");
if (["places","season","course","deals","pack","journal","ops"].includes(h)) state.tab = h;
if (h==="stay"){ state.tab = "places"; state.cat = "숙소"; }
if (window.APK_BUILD) document.body.classList.add("apk");
render();
initRuntime();
setLang(LANG);
</script>

</body></html>
