name: 숙소 사진 받기(일회성)
on: { workflow_dispatch: {} }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P'
          import re, json, urllib.request
          s = open("source/index.html", encoding="utf-8").read()
          i = s.index("const STAY_PH = ") + len("const STAY_PH = ")
          ph, _ = json.JSONDecoder().raw_decode(s[i:])
          ok = bad = 0
          for k, v in ph.items():
              try:
                  r = urllib.request.urlopen(urllib.request.Request(v["url"], headers={"User-Agent": "Mozilla/5.0"}), timeout=20)
                  n = len(r.read()); ok += 1
                  if n < 2000: print("SMALL", k, n)
              except Exception as e: bad += 1; print("BAD", k, e)
          print("PHCHK", ok, bad)
          P
