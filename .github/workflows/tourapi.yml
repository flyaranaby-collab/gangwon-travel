name: 관광공사 장소 업데이트
# 앱 운영 페이지의 '관광공사 최신 정보 받기' 버튼이 이 작업을 실행한다.
# 저장소 Settings → Secrets and variables → Actions 에 KTO_KEY(공공데이터포털 일반 인증키)가 있어야 한다.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tourapi
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 인증키 확인
        env: { KTO_KEY: "${{ secrets.KTO_KEY }}" }
        run: |
          if [ -z "$KTO_KEY" ]; then echo "::error::저장소 비밀값 KTO_KEY가 없습니다. Settings → Secrets and variables → Actions 에 넣어 주세요."; exit 1; fi
      - name: 관광공사 데이터 받기
        env: { KTO_KEY: "${{ secrets.KTO_KEY }}" }
        run: python3 tools/tourapi_sync.py --key "$KTO_KEY" --json web/kto.json --ver web/kto_ver.txt
      - name: 관광사진(포토코리아)으로 사진 없는 곳 채우기
        continue-on-error: true
        env: { KTO_KEY: "${{ secrets.KTO_KEY }}" }
        run: python3 tools/gallery_sync.py --key "$KTO_KEY" --kto web/kto.json --html web/index.html --ver web/kto_ver.txt
      - name: 저장소에 올리기
        run: |
          git config user.name "gangwon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/kto.json web/kto_ver.txt
          git diff --cached --quiet && echo "바뀐 내용 없음" && exit 0
          git commit -m "관광공사 장소 업데이트 (자동)"
          git pull --rebase -q && git push
