name: 공중화장실·공영주차장 업데이트
on:
  schedule:
    - cron: '23 19 * * 0'   # 매주 월요일 04:23(한국)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tourapi
  cancel-in-progress: false
jobs:
  facil:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 자료 받기
        env: { KTO_KEY: "${{ secrets.KTO_KEY }}" }
        run: python3 tools/facil_sync.py --key "$KTO_KEY" --out web/facil.json
      - name: 저장소에 올리기
        run: |
          git config user.name "gangwon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/facil.json
          git diff --cached --quiet && echo "바뀐 내용 없음" && exit 0
          git commit -m "공중화장실·공영주차장 업데이트 (자동)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && exit 0; sleep $((i*10)); done; exit 1
